# Test every change to main (and every PR), then publish the toy phone to GitHub Pages.
# The deployed site is plain HTML/CSS/JavaScript; the test job is the release gate.
name: Test and deploy GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'screenshots/**']
  pull_request:
    branches: [main]
    paths-ignore: ['README.md', 'screenshots/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Chromium + WebKit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run release test suite
        run: npm run test:ci

      - name: Upload smoke-test screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kidphone-test-screenshots-${{ github.run_id }}
          path: tests/screenshots/
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    name: Deploy
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Gather the site
        run: |
          mkdir -p _site/assets
          cp index.html manifest.webmanifest sw.js _site/
          cp -R icons _site/icons
          # Real animal recordings. Private family voices/photos are deliberately not published.
          cp -R assets/sounds _site/assets/sounds
          # Pre-recorded narrator and animal voices.
          cp -R assets/voice _site/assets/voice
          ls -R _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
