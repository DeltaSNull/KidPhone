# Test every change to main (and every PR), then publish the toy phone to GitHub Pages.
# The deployed site is plain HTML/CSS/JavaScript; all test jobs must pass before deployment.
name: Test and deploy GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'screenshots/**']
  pull_request:
    branches: [main]
    paths-ignore: ['README.md', 'screenshots/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromium-smoke:
    name: Chromium smoke (${{ matrix.viewport }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        viewport: [portrait, landscape, safari-bars]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run ${{ matrix.viewport }} smoke suite
        run: ONLY=${{ matrix.viewport }} npm test

      - name: Upload smoke-test screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.viewport }}-${{ github.run_id }}
          path: tests/screenshots/
          if-no-files-found: ignore
          retention-days: 7

  pages:
    name: Pages/offline (${{ matrix.engine }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: chromium
            command: npm run test:pages
          - engine: webkit
            command: npm run test:pages:webkit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install ${{ matrix.engine }}
        run: npx playwright install --with-deps ${{ matrix.engine }}

      - name: Run Pages/offline checks
        run: ${{ matrix.command }}

      - name: Parent controls (Chromium)
        if: matrix.engine == 'chromium'
        run: npm run test:parents

      - name: Parent controls (WebKit)
        if: matrix.engine == 'webkit'
        run: npm run test:parents:webkit

  webkit-smoke:
    name: WebKit iPhone smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install WebKit
        run: npx playwright install --with-deps webkit

      - run: npm run test:webkit

  deploy:
    name: Deploy
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [chromium-smoke, pages, webkit-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Gather the site
        run: |
          mkdir -p _site/assets
          cp index.html manifest.webmanifest sw.js _site/
          cp -R icons _site/icons
          # Real animal recordings. Private family voices/photos are deliberately not published.
          cp -R assets/sounds _site/assets/sounds
          # Pre-recorded narrator and animal voices.
          cp -R assets/voice _site/assets/voice
          ls -R _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
