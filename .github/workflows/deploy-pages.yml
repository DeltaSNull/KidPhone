name: Verify published KidPhone release
on:
  push:
    branches: [codex/live-release-verification]
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify deployed files and voice assets
        shell: python
        run: |
          import hashlib, json, pathlib, time, urllib.request
          base = 'https://deltasnull.github.io/KidPhone/'
          def get(path):
              with urllib.request.urlopen(base + path, timeout=30) as r:
                  assert r.status == 200
                  return r.read()
          expected = pathlib.Path('index.html').read_bytes()
          for attempt in range(100):
              try:
                  html = get('index.html?release=0bec426ea3adbc8dcc42455b61ea575eda726375')
                  if html == expected:
                      break
              except Exception as error:
                  print(type(error).__name__, str(error), flush=True)
              print('Waiting for merged release to reach Pages', attempt + 1, flush=True)
              time.sleep(15)
          else:
              raise AssertionError('Published HTML never matched merged release')
          manifest = json.loads(get('assets/voice/voice.json'))
          assert manifest == json.loads(pathlib.Path('assets/voice/voice.json').read_text())
          assert len(manifest['clips']) == 2330
          clips = sorted({clip[0] for clip in manifest['clips'].values()})
          for clip in [clips[0], clips[len(clips)//2], clips[-1]]:
              assert get('assets/voice/' + clip) == pathlib.Path('assets/voice', clip).read_bytes(), clip
          for path in ['sw.js', 'manifest.webmanifest']:
              assert get(path) == pathlib.Path(path).read_bytes(), path
          print('PASS: live app, service worker, manifest and sampled voice files match the tested release')
          print('Live HTML SHA256:', hashlib.sha256(html).hexdigest())
      - name: Exercise published School activities
        run: |
          node <<'JS'
          const assert = require('node:assert/strict');
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch();
            try {
              const context = await browser.newContext({viewport:{width:390,height:844},hasTouch:true,isMobile:true,serviceWorkers:'block'});
              await context.addInitScript(() => {
                localStorage.setItem('toyphone.settings',JSON.stringify({incoming:false,camera:'pretend',look:'drag',tilt:'off'}));
                localStorage.setItem('toyphone.access',JSON.stringify({mode:'school'}));
              });
              await context.route('https://fonts.googleapis.com/**',r=>r.fulfill({body:''}));
              await context.route('https://fonts.gstatic.com/**',r=>r.abort());
              await context.route('**/assets/family/family.json',r=>r.fulfill({json:{contacts:[]}}));
              await context.route('**/assets/voice/voice.json',r=>r.fulfill({status:404,body:''}));
              const page=await context.newPage(), errors=[];
              page.on('pageerror',e=>errors.push(e.message));
              const response=await page.goto('https://deltasnull.github.io/KidPhone/?release=0bec426ea3adbc8dcc42455b61ea575eda726375');
              assert.equal(response.status(),200);
              await page.waitForFunction(()=>window.__toyPhone);
              assert.equal(await page.locator('#school:visible').count(),1);
              assert.equal(await page.locator('#schoolList .gamecard').count(),11);
              for(const [id,key,label] of [['sorting','red-square','Sorting Station'],['patterntrain','blue','Pattern Train'],['storytime','sprout','Story Time'],['feelings','sad','Feelings Friends']]) {
                const card=page.locator('#schoolList .gamecard[aria-label="'+label+'"]');
                await card.scrollIntoViewIfNeeded();
                await card.tap();
                await page.locator('#'+id).waitFor({state:'visible'});
                await page.locator('#'+id+' [data-choice="'+key+'"]').tap();
                await page.locator('#'+id+' [data-next]').waitFor({state:'visible'});
                await page.locator('#'+id+' [data-back]').tap();
                await page.locator('#school').waitFor({state:'visible'});
                console.log('PASS live School activity:',id);
              }
              assert.deepEqual(errors,[]);
              console.log('PASS live School menu, four activity answers and return navigation; no JavaScript errors');
            } finally { await browser.close(); }
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS
