name: Verify live legibility release
on:
  push:
    branches: [codex/live-legibility-verification]
permissions:
  contents: read
jobs:
  live:
    name: Live files and legibility
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Wait for deployment and compare public files
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, time, urllib.request
          root = pathlib.Path.cwd()
          base = 'https://deltasnull.github.io/KidPhone/'
          expected = (root/'index.html').read_bytes()
          def get(path):
              request = urllib.request.Request(base+path, headers={'Cache-Control':'no-cache'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  assert response.status == 200
                  return response.read()
          for attempt in range(60):
              try:
                  if get('index.html') == expected:
                      break
              except Exception as error:
                  print(type(error).__name__, flush=True)
              print('Waiting for tested legibility release to appear on the public site', flush=True)
              time.sleep(30)
          else:
              raise AssertionError('Tested release did not appear within 30 minutes')
          for path in ['index.html','sw.js','manifest.webmanifest','assets/voice/voice.json']:
              assert get(path) == (root/path).read_bytes(), 'live file differs: '+path
          manifest = json.loads(get('assets/voice/voice.json'))
          assert len(manifest['clips']) == 2330
          clips = sorted({clip[0] for clip in manifest['clips'].values()})
          for clip in [clips[0],clips[len(clips)//2],clips[-1]]:
              assert get('assets/voice/'+clip) == (root/'assets/voice'/clip).read_bytes()
          print('PASS live HTML, worker, app/voice manifests and sampled recordings match tested release', flush=True)
          print('Live HTML SHA256:',hashlib.sha256(expected).hexdigest(),flush=True)
          PY
      - name: Run portrait, landscape and short-phone legibility on the public site
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('tests/text-legibility.cjs').read_text()
          source = source.replace("const ROOT=path.resolve(__dirname,'..')","const ROOT=process.cwd()")
          source = source.replace("`http://127.0.0.1:${server.address().port}/`","'https://deltasnull.github.io/KidPhone/'")
          assert "'https://deltasnull.github.io/KidPhone/'" in source
          Path('/tmp/verify-live-legibility.cjs').write_text(source)
          PY
          NODE_PATH="$GITHUB_WORKSPACE/node_modules" node /tmp/verify-live-legibility.cjs
      - name: Save live verification screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-legibility
          path: tests/screenshots/legibility-*.png
          retention-days: 7
