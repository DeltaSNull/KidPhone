<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- Add to Home Screen: opens full screen with no Safari bars (self-hosted only) -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Toy Phone">
<meta name="theme-color" content="#FF6F5E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<!-- page:start: tools/make-artifact.cjs keeps from here to page:end, plus the body, for the claude.ai artifact build -->
<meta name="format-detection" content="telephone=no">
<title>Toy Phone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap">
<style>
/* Layout: a chunky cartoon toy phone that fills the real one. A coral case frames one rounded screen.
   The big yellow home button sits in the chin under the screen (portrait) or beside it (landscape),
   so it is in the same spot in every app. Inside the screen: a pretend status bar, then one app at a time.
   Single bright daytime look on purpose: it's a toddler toy, so there is no dark theme. */
:root{
  --case:#FF6F5E; --case-deep:#D24A3D; --case-hi:#FF9C8F;
  --ink:#3B2B20; --paper:#FFFDF6; --cream:#FFF6E0;
  --sky:#8FD8F5; --sun:#FFC83D; --grass:#7CC96B; --leaf:#3E9447;
  --berry:#E8506E; --lagoon:#3D8FE0; --grape:#8A6FD1; --tang:#FF9F43; --mint:#5CC9B5;
  --go:#3BBF5C; --go-deep:#23893D; --stop:#F04E4E; --stop-deep:#B32E2E;
  --drop:0 6px 0 rgba(59,43,32,.32); --drop-sm:0 4px 0 rgba(59,43,32,.26);
  --display:"Baloo 2","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  --status:30px; --bar:84px; --gap:10px; --home:84px;
  --icon:clamp(120px, min(32vw, 19vh), 150px); --igap:clamp(20px,8vw,40px);
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  background:var(--case);
}
@media (orientation:landscape){ :root{ --status:26px; --bar:80px; --gap:8px; --icon:clamp(120px, min(15vw, 29vh), 140px) } }
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{
  margin:0; background:var(--case); color:var(--ink); font-family:var(--display); font-weight:800; font-size:18px; line-height:1.15;
  overflow:hidden; overscroll-behavior:none; touch-action:none;
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; -webkit-text-size-adjust:100%;
}
button{font:inherit; color:inherit; border:0; background:none; padding:0; margin:0; cursor:pointer; touch-action:none; -webkit-tap-highlight-color:transparent}
button:focus-visible{outline:4px solid var(--ink); outline-offset:3px}
img{max-width:100%; -webkit-user-drag:none}
svg{display:block}
.em{font-family:var(--emoji); font-weight:400; line-height:1}
.bump{animation:bump .24s ease-out}
@keyframes bump{40%{transform:scale(.9)}}

/* ---------- The toy phone case ---------- */
#device{
  height:100%; display:grid; grid-template-rows:minmax(0,1fr) auto;
  padding:var(--gap) max(var(--gap),env(safe-area-inset-right,0px)) 0 max(var(--gap),env(safe-area-inset-left,0px));
  background:radial-gradient(ellipse at 12% 0%, var(--case-hi) 0 18%, transparent 52%), var(--case);
}
@media (orientation:landscape){
  #device{grid-template-rows:none; grid-template-columns:minmax(0,1fr) auto; padding:var(--gap) 0 var(--gap) max(var(--gap),env(safe-area-inset-left,0px))}
}
#screen{position:relative; min-width:0; min-height:0; border-radius:28px; overflow:hidden; background:var(--sky); box-shadow:0 0 0 5px var(--case-deep); isolation:isolate}
#chin{display:grid; place-items:center; padding:14px 0 12px}
@media (orientation:landscape){ #chin{padding:0 max(14px,env(safe-area-inset-right,0px)) 0 16px} }
#homeBtn{
  width:var(--home); height:var(--home); border-radius:50%; display:grid; place-items:center;
  background:radial-gradient(circle at 36% 30%, #FFE9A3 0 16%, var(--sun) 52%, #E6A312 100%);
  box-shadow:0 0 0 6px var(--case-deep), 0 9px 0 6px rgba(59,43,32,.28);
}
#homeBtn svg{width:46px; height:46px}

/* ---------- Pretend status bar ---------- */
#status{
  position:absolute; inset:0 0 auto 0; height:var(--status); z-index:30; display:flex; align-items:center; justify-content:space-between;
  padding:0 16px; font-size:calc(var(--status) * .64); background:rgba(255,253,246,.72); pointer-events:none;
}
#clock{pointer-events:auto; position:relative; height:100%; display:flex; align-items:center; padding:0 12px; margin-left:-12px; font-variant-numeric:tabular-nums; touch-action:none}
#clock .hold{position:absolute; left:8px; right:8px; bottom:2px; height:4px; border-radius:2px; background:var(--ink); transform:scaleX(0); transform-origin:left; opacity:.55}
#clock.holding .hold{transform:scaleX(1); transition:transform 2.4s linear}
#clock.wig{animation:wig .3s}
.sicons{display:flex; align-items:center; gap:8px; height:100%}
.sicons svg{height:56%; width:auto}
@keyframes wig{0%,100%{rotate:0deg}30%{rotate:-8deg}70%{rotate:8deg}}

/* ---------- Apps ---------- */
#apps{position:absolute; inset:var(--status) 0 0 0}
.app{position:absolute; inset:0; display:flex; flex-direction:column; gap:var(--gap); padding:var(--gap)}
.app.enter{animation:appIn .3s cubic-bezier(.25,1.3,.5,1)}
@keyframes appIn{from{transform:scale(.35); opacity:0}}
.tabs{display:flex; justify-content:center; gap:12px; flex:none}
.tab{width:var(--bar); height:var(--bar); border-radius:24px; display:grid; place-items:center; background:rgba(255,253,246,.42); box-shadow:var(--drop-sm)}
.tab.on{background:var(--paper); box-shadow:0 0 0 4px var(--ink), var(--drop-sm)}
.tab svg{width:64%; height:64%}
.tab .em{font-size:calc(var(--bar) * .54)}
.pane{flex:1; min-height:0; min-width:0; position:relative}
.round{width:96px; height:96px; border-radius:50%; display:grid; place-items:center; flex:none}
.round svg{width:62%; height:62%}
.round.go{background:var(--go); box-shadow:0 7px 0 var(--go-deep)}
.round.stop{background:var(--stop); box-shadow:0 7px 0 var(--stop-deep)}
.word{
  position:absolute; left:50%; top:4%; translate:-50% 0; background:#fff; color:var(--ink); font-size:clamp(18px,4.6vw,26px);
  padding:0 12px; border-radius:16px; box-shadow:var(--drop-sm); white-space:nowrap; opacity:0; pointer-events:none; z-index:3;
}
.word.pop{animation:pop 1.2s ease-out}
@keyframes pop{0%{opacity:0; transform:scale(.4) translateY(10px)}15%{opacity:1; transform:scale(1.1)}25%{transform:scale(1)}75%{opacity:1}100%{opacity:0; transform:translateY(-14px)}}
@keyframes hop{0%,100%{transform:none}35%{transform:translateY(-16%) scale(.94,1.08)}70%{transform:scale(1.06,.94)}}
.hop{animation:hop .45s cubic-bezier(.3,1.6,.5,1)}

/* ---------- Home ---------- */
#home{
  justify-content:space-between;
  background:
    radial-gradient(circle at 90% 12%, var(--sun) 0 30px, rgba(255,240,170,.8) 31px 46px, transparent 47px),
    radial-gradient(ellipse 75% 28% at 18% 102%, #5DB35A 0 60%, transparent 61%),
    radial-gradient(ellipse 80% 30% at 88% 106%, #4FA84C 0 60%, transparent 61%),
    linear-gradient(180deg, #8FD8F5 0%, #CBEFFF 66%, #A8E08F 66%, #7CC96B 100%);
}
.icons{flex:1; min-height:0; display:flex; flex-wrap:wrap; justify-content:center; align-content:center; gap:12px var(--igap); width:100%; max-width:calc(var(--icon)*2 + var(--igap) + 8px); margin:0 auto}
@media (orientation:landscape){ .icons{max-width:calc(var(--icon)*3 + var(--igap)*2 + 8px)} .appicon .lbl{font-size:18px} }
.appicon{display:flex; flex-direction:column; align-items:center; gap:4px}
.appicon .tile{
  position:relative; width:var(--icon); height:var(--icon); display:grid; place-items:center; overflow:hidden;
  border-radius:40% 44% 42% 38% / 42% 38% 44% 40%; box-shadow:var(--drop), inset 0 -8px 0 rgba(59,43,32,.14);
}
.appicon .tile::before{content:""; position:absolute; left:14%; top:8%; width:42%; height:20%; border-radius:50%; background:rgba(255,255,255,.3); rotate:-14deg}
.appicon .tile svg{width:70%; height:70%; position:relative}
.appicon .lbl{font-size:20px; color:#fff; text-shadow:0 2px 0 rgba(59,43,32,.6), 0 0 8px rgba(59,43,32,.3)}
.t-phone{background:linear-gradient(160deg,#FF95A8,#E8506E)}
.t-camera{background:linear-gradient(160deg,#82CBFF,#3D8FE0)}
.t-photos{background:linear-gradient(160deg,#FFE38A,#FFAE34)}
.t-music{background:linear-gradient(160deg,#BCA6F2,#7B5DCB)}
.t-games{background:linear-gradient(160deg,#8EE07A,#36A04A)}
.appicon.go .tile{animation:hop .45s cubic-bezier(.3,1.6,.5,1)}
.friends{flex:none; display:flex; justify-content:space-around; align-items:flex-end; height:96px}
@media (orientation:landscape), (max-height:799px){ .friends{display:none} }   /* five big icons need the room */
.friend{position:relative; width:clamp(84px,24vw,120px); height:100%; display:grid; place-items:end center; font-size:76px}
.friend .em{transform-origin:50% 100%; display:block}
.friend.go .em{animation:hop .45s cubic-bezier(.3,1.6,.5,1)}
.friend .word{top:-10%}

/* ---------- Phone ---------- */
#phone{background:linear-gradient(180deg,#CFF6EC,#86DCC8)}
.tabs.two .tab{width:min(42%,170px)}
@media (orientation:landscape){
  #phone{flex-direction:row}
  #phone .tabs{flex-direction:column; justify-content:center}
  #phone .tabs.two .tab{width:var(--bar); height:min(42%,130px)}
}
#contacts{display:grid; gap:10px}
.contact{display:grid; grid-template-rows:minmax(0,1fr) auto; place-items:center; gap:2px; min-width:0; min-height:0; padding:4px 2px 6px; border-radius:22px; background:rgba(255,253,246,.5); box-shadow:var(--drop-sm)}
.face{
  width:var(--face,80px); height:var(--face,80px); border-radius:50%; display:grid; place-items:center; overflow:hidden; flex:none;
  font-family:var(--emoji); font-weight:400; font-size:calc(var(--face,80px) * .62); line-height:1;
  background:radial-gradient(circle at 34% 28%, rgba(255,255,255,.65), transparent 52%), var(--c,#FFD36E);
  box-shadow:inset 0 -6px 0 rgba(59,43,32,.13), 0 0 0 4px var(--paper);
}
.face svg{width:86%; height:auto}
.face img{width:100%; height:100%; object-fit:cover}
.nm{font-size:15px; line-height:1.3; background:var(--paper); border-radius:10px; padding:0 8px; white-space:nowrap; max-width:100%; overflow:hidden; text-overflow:ellipsis}
#keypad{display:grid; gap:10px; grid-template-rows:56px minmax(0,1fr) auto; grid-template-areas:"dial" "keys" "call"}
.dial{grid-area:dial; border-radius:20px; background:var(--paper); box-shadow:inset 0 4px 0 rgba(59,43,32,.12); display:flex; align-items:center; justify-content:center;
  font-size:38px; letter-spacing:3px; font-variant-numeric:tabular-nums; pointer-events:none; overflow:hidden; white-space:nowrap}
.dial span{display:inline-block; animation:pop2 .25s}
@keyframes pop2{from{transform:scale(1.8) translateY(-8px)}}
.keys{grid-area:keys; display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(4,1fr); gap:10px; min-height:0}
.key{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; min-height:0; border-radius:26px; background:var(--paper); box-shadow:var(--drop-sm); font-size:clamp(30px,5.4vh,46px); line-height:1}
.key .dots{display:flex; flex-wrap:wrap; justify-content:center; gap:3px; max-width:46px; min-height:7px}
.key .dots i{width:7px; height:7px; border-radius:50%; background:var(--c)}
.key.lit{background:#FFF1A6}
.callbtn{grid-area:call; justify-self:center; width:min(100%,230px); height:var(--bar); border-radius:44px; display:grid; place-items:center; background:var(--go); box-shadow:0 7px 0 var(--go-deep)}
.callbtn svg{height:78%; width:auto}
@media (orientation:portrait) and (max-height:760px){ .keys{grid-template-columns:repeat(4,1fr); grid-template-rows:repeat(3,1fr)} }   /* Safari with its bars showing: wider keys, taller rows */
@media (orientation:landscape){
  #keypad{grid-template-columns:minmax(0,1fr) auto; grid-template-rows:var(--bar) minmax(0,1fr); grid-template-areas:"dial call" "keys keys"}
  .keys{grid-template-columns:repeat(6,1fr); grid-template-rows:repeat(2,1fr)}
  .callbtn{width:200px; height:100%}
  .dial{font-size:42px}
}

/* ---------- Call screen ---------- */
#call{
  position:absolute; inset:var(--status) 0 0 0; z-index:20; display:grid; justify-items:center; align-items:center; gap:4px; padding:14px 14px 18px;
  grid-template-rows:minmax(0,1fr) auto auto auto; grid-template-areas:"face" "name" "time" "btns";
  background:radial-gradient(circle at 50% 34%, rgba(255,255,255,.7) 0 18%, transparent 58%), var(--c,#FFD36E);
}
@media (orientation:landscape){
  #call{grid-template-columns:1fr 1fr; grid-template-rows:1fr auto auto auto 1fr; grid-template-areas:"face ." "face name" "face time" "face btns" "face .";
    background:radial-gradient(circle at 26% 50%, rgba(255,255,255,.7) 0 18%, transparent 52%), var(--c,#FFD36E)}
}
#call .face{grid-area:face; --face:min(64vw,36vh,250px)}
@media (orientation:landscape){ #call .face{--face:min(30vw,60vh,240px)} }
#call.ringing .face{animation:ringbob .7s ease-in-out infinite}
#call.dialing .face{animation:breathe 1.2s ease-in-out infinite}
#call .face.talk{animation:talk .26s ease-in-out infinite alternate}
#call.ending .face{animation:wave .5s ease-in-out 3}
@keyframes ringbob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-10%) rotate(4deg)}}
@keyframes breathe{50%{transform:scale(1.05)}}
@keyframes talk{from{transform:scale(1) rotate(-2deg)}to{transform:scale(1.07) rotate(2deg)}}
@keyframes wave{0%,100%{rotate:0deg}30%{rotate:-10deg}70%{rotate:10deg}}
.callname{grid-area:name; font-size:30px; color:#fff; text-shadow:0 3px 0 rgba(59,43,32,.5), 0 0 10px rgba(59,43,32,.25)}
.calltime{grid-area:time; min-height:40px; display:flex; align-items:center; justify-content:center; gap:8px; font-size:26px; font-variant-numeric:tabular-nums; background:rgba(255,253,246,.85); border-radius:18px; padding:0 16px}
.calltime i{width:12px; height:12px; border-radius:50%; background:var(--ink); animation:dot 1s infinite}
.calltime i:nth-child(2){animation-delay:.2s} .calltime i:nth-child(3){animation-delay:.4s}
@keyframes dot{0%,100%{opacity:.2; transform:scale(.7)}50%{opacity:1; transform:scale(1)}}
.callbtns{grid-area:btns; display:flex; gap:clamp(48px,22vw,110px); justify-content:center; padding-top:10px}
.callbtns .round{width:104px; height:104px}
#call.ringing #answerBtn{animation:wiggle .6s ease-in-out infinite}
@keyframes wiggle{0%,100%{rotate:0deg}25%{rotate:-12deg}75%{rotate:12deg}}
.wave{position:absolute; font-size:64px; pointer-events:none; animation:wavehand .5s ease-in-out 3; z-index:2}
@keyframes wavehand{0%,100%{rotate:-15deg}50%{rotate:20deg}}

/* ---------- Camera ---------- */
#camera{display:grid; grid-template-rows:auto minmax(0,1fr) auto; background:linear-gradient(180deg,#63B6F2,#2F7FD0)}
.camscenes,.camctrls{display:flex; justify-content:center; align-items:center; gap:16px}
.camctrls{justify-content:space-around; padding-bottom:4px}
@media (orientation:landscape){
  #camera{grid-template-rows:none; grid-template-columns:auto minmax(0,1fr) auto}
  .camscenes,.camctrls{flex-direction:column; justify-content:center; padding:0}
  .camctrls{justify-content:space-around}
}
.scenebtn{width:80px; height:80px; border-radius:50%; display:grid; place-items:center; background:rgba(255,253,246,.35); box-shadow:var(--drop-sm); font-size:46px}
.scenebtn.on{background:var(--paper); box-shadow:0 0 0 5px var(--sun), var(--drop-sm)}
.vf{position:relative; min-height:0; min-width:0; border-radius:22px; overflow:hidden; background:#CFF1FF; touch-action:none; box-shadow:0 0 0 5px var(--paper), 0 9px 0 5px rgba(0,0,0,.16)}
.vf canvas{position:absolute; inset:0; width:100%; height:100%; display:block}
.vf .flash{position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none}
.vf .flash.go{animation:flash .5s ease-out}
@keyframes flash{0%{opacity:1}100%{opacity:0}}
.vf.shake{animation:camshake .28s}
@keyframes camshake{20%{transform:translate(-5px,3px)}40%{transform:translate(5px,-3px)}60%{transform:translate(-3px,-2px)}80%{transform:translate(3px,2px)}}
.vf .corner{position:absolute; width:34px; height:34px; border:6px solid rgba(255,255,255,.9); pointer-events:none}
.vf .c1{left:12px; top:12px; border-right:0; border-bottom:0; border-radius:10px 0 0 0}
.vf .c2{right:12px; top:12px; border-left:0; border-bottom:0; border-radius:0 10px 0 0}
.vf .c3{left:12px; bottom:12px; border-right:0; border-top:0; border-radius:0 0 0 10px}
.vf .c4{right:12px; bottom:12px; border-left:0; border-top:0; border-radius:0 0 10px 0}
.shutter{width:96px; height:96px; border-radius:50%; background:var(--paper); box-shadow:0 0 0 7px rgba(255,255,255,.45), 0 7px 0 7px rgba(0,0,0,.14); display:grid; place-items:center}
.shutter::after{content:""; width:66%; height:66%; border-radius:50%; background:radial-gradient(circle at 35% 30%, #FF8A80, var(--stop)); box-shadow:inset 0 -5px 0 rgba(0,0,0,.15)}
.thumb{width:80px; height:80px; border-radius:18px; overflow:hidden; background:rgba(255,253,246,.35); box-shadow:0 0 0 4px var(--paper), var(--drop-sm); display:grid; place-items:center}
.thumb img{width:100%; height:100%; object-fit:cover; pointer-events:none}
.thumb.new{animation:hop .5s cubic-bezier(.3,1.6,.5,1)}
.zoombtn{width:80px; height:80px; border-radius:50%; background:var(--sun); box-shadow:var(--drop-sm); display:grid; place-items:center; position:relative}
.zoombtn svg{width:54%; height:54%}
.zoombtn b{position:absolute; right:2px; bottom:-2px; background:var(--paper); border-radius:12px; padding:0 6px; font-size:20px; box-shadow:var(--drop-sm)}

/* ---------- Photos ---------- */
#photos{background:linear-gradient(180deg,#FFF4C9,#FFDF8A)}
.pgrid{flex:1; min-height:0; overflow-y:auto; touch-action:pan-y; overscroll-behavior:contain; -webkit-overflow-scrolling:touch;
  display:grid; grid-template-columns:repeat(auto-fill,minmax(102px,1fr)); gap:14px; align-content:start; padding:6px 4px 14px}
.pic{aspect-ratio:1; border-radius:12px; background:var(--paper); padding:6px; box-shadow:var(--drop-sm); rotate:var(--r,0deg); touch-action:pan-y}
.pic img{width:100%; height:100%; object-fit:cover; border-radius:7px; display:block; pointer-events:none}
.pempty{flex:1; display:grid; place-items:center}
.bigcam{width:min(52vw,40vh,200px); aspect-ratio:1; border-radius:40% 44% 42% 38% / 42% 38% 44% 40%; background:linear-gradient(160deg,#82CBFF,#3D8FE0); box-shadow:var(--drop); display:grid; place-items:center; animation:breathe 1.6s ease-in-out infinite}
.bigcam svg{width:72%; height:72%}
.viewer{position:absolute; inset:0; z-index:4; display:grid; gap:var(--gap); padding:var(--gap);
  grid-template-columns:auto minmax(0,1fr) auto; grid-template-rows:minmax(0,1fr) auto; grid-template-areas:"stage stage stage" "prev grid next";
  background:linear-gradient(180deg,#FFF4C9,#FFDF8A)}
@media (orientation:landscape){ .viewer{grid-template-rows:auto minmax(0,1fr); grid-template-areas:"grid stage next" "prev stage next"} }
.vbtn{width:84px; height:84px; border-radius:50%; background:var(--paper); box-shadow:var(--drop-sm); display:grid; place-items:center; align-self:center; justify-self:center}
.vbtn svg{width:56%; height:56%}
#vGrid{grid-area:grid; border-radius:24px} #vPrev{grid-area:prev} #vNext{grid-area:next}
@media (orientation:landscape){ #vGrid{align-self:start} #vPrev{align-self:end} }
.vstage{grid-area:stage; min-height:0; min-width:0; display:grid; place-items:center; touch-action:none}
.vstage img{max-width:100%; max-height:100%; border:8px solid var(--paper); border-radius:14px; box-shadow:var(--drop); display:block; pointer-events:none; background:var(--paper)}
.vstage img.in-l{animation:inL .28s ease-out} .vstage img.in-r{animation:inR .28s ease-out} .vstage img.hop{animation:hop .45s}
@keyframes inL{from{transform:translateX(-40%) rotate(-6deg); opacity:0}}
@keyframes inR{from{transform:translateX(40%) rotate(6deg); opacity:0}}

/* ---------- Music ---------- */
#music{background:linear-gradient(180deg,#ECE3FF,#BBA6F2)}
#music .tab{width:min(var(--bar), calc((100% - 36px) / 4))}
.mpane{flex:1; min-height:0; min-width:0; position:relative}
#xylo{display:flex; flex-direction:column; align-items:center; gap:6px; padding:2px 0 6px}
.bar{position:relative; flex:1; width:var(--len); min-height:0; border-radius:14px; background:linear-gradient(180deg,rgba(255,255,255,.4),transparent 50%), var(--c); box-shadow:0 5px 0 rgba(59,43,32,.28)}
.bar::before,.bar::after{content:""; position:absolute; top:50%; width:12px; height:12px; margin-top:-6px; border-radius:50%; background:rgba(255,255,255,.88); box-shadow:inset 0 -2px 0 rgba(0,0,0,.15)}
.bar::before{left:7%} .bar::after{right:7%}
.bar.hit{animation:barhit .3s ease-out}
@keyframes barhit{30%{transform:scale(.96,.86); filter:brightness(1.25)}}
@media (orientation:landscape){
  #xylo{flex-direction:row; padding:0 2px 6px}
  .bar{width:auto; height:var(--len); background:linear-gradient(90deg,rgba(255,255,255,.4),transparent 50%), var(--c)}
  .bar::before,.bar::after{left:50%; top:auto; margin:0 0 0 -6px}
  .bar::before{top:7%} .bar::after{bottom:7%; right:auto}
}
#drums{display:grid; grid-template-columns:repeat(2,1fr); grid-template-rows:repeat(3,1fr); gap:12px}
@media (orientation:landscape){ #drums{grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(2,1fr)} }
.pad{position:relative; min-height:0; min-width:0; border-radius:30px; display:grid; place-items:center; background:var(--c); box-shadow:0 6px 0 rgba(59,43,32,.3), inset 0 0 0 7px rgba(255,255,255,.45)}
.pad .em{font-size:clamp(44px,min(12vw,9vh),78px); pointer-events:none}
.pad.hit{animation:padhit .25s ease-out}
@keyframes padhit{35%{transform:scale(.92); filter:brightness(1.2)}}
#piano{display:flex; flex-direction:column; gap:5px; padding-bottom:6px}
.pkey{position:relative; flex:1; min-height:0; display:flex; align-items:center; justify-content:flex-end; padding:0 14px; border-radius:6px 18px 18px 6px; background:linear-gradient(90deg,#EDE6DA,var(--paper) 30%); box-shadow:0 5px 0 rgba(59,43,32,.28)}
.pkey .em{font-size:clamp(28px,4.6vh,44px); width:1.45em; height:1.45em; display:grid; place-items:center; border-radius:50%; pointer-events:none;
  background:var(--cream); background:color-mix(in srgb, var(--c) 40%, #fff); box-shadow:inset 0 -3px 0 rgba(59,43,32,.12)}
.pkey.blk::after{content:""; position:absolute; z-index:2; left:0; bottom:calc(-21% - 3px); width:30%; height:42%; border-radius:0 10px 10px 0; background:linear-gradient(90deg,#2B1D12,#4A3628); pointer-events:none}
.pkey.hit{background:linear-gradient(90deg,#FFE9A8,#FFF6CF 40%)}
.pkey .word{left:auto; right:20%; top:50%; translate:0 -50%}
@media (orientation:landscape){
  #piano{flex-direction:row; padding:0 0 6px}
  .pkey{flex-direction:column; justify-content:flex-end; padding:10px 0; border-radius:6px 6px 18px 18px; background:linear-gradient(180deg,#EDE6DA,var(--paper) 30%)}
  .pkey.hit{background:linear-gradient(180deg,#FFE9A8,#FFF6CF 40%)}
  .pkey.blk::after{left:auto; bottom:auto; top:0; right:calc(-21% - 3px); width:42%; height:30%; border-radius:0 0 10px 10px; background:linear-gradient(180deg,#2B1D12,#4A3628)}
  .pkey .word{right:auto; left:50%; top:8%; translate:-50% 0}
}
#songs{display:grid; gap:10px; grid-template-rows:auto minmax(0,1fr) auto; grid-template-areas:"tiles" "stage" "ctl"}
@media (orientation:landscape){ #songs{grid-template-rows:none; grid-template-columns:auto minmax(0,1fr) auto; grid-template-areas:"tiles stage ctl"} }
.songtiles{grid-area:tiles; display:grid; grid-template-columns:repeat(4,1fr); gap:10px}
@media (orientation:landscape){ .songtiles{grid-template-columns:repeat(2,84px); align-content:center} }
.song{height:84px; border-radius:22px; background:var(--paper); box-shadow:var(--drop-sm); font-size:46px; display:grid; place-items:center}
.song.on{background:var(--sun); box-shadow:0 0 0 4px var(--ink), var(--drop-sm)}
.stage{grid-area:stage; position:relative; min-height:0; border-radius:24px; overflow:hidden; display:grid; place-items:end center;
  background:radial-gradient(ellipse 60% 16% at 50% 92%, #FFC24B 0 98%, transparent 100%), linear-gradient(180deg,#FFE7F3,#FFC7E0)}
.dancer{font-size:clamp(90px,min(34vw,24vh),190px); padding-bottom:6%; transform-origin:50% 100%; transition:transform .12s ease-out}
.dancer.l{transform:translateY(-10%) rotate(-12deg)} .dancer.r{transform:translateY(-10%) rotate(12deg)}
.dancer.bow{animation:hop .5s 2}
.songctl{grid-area:ctl; display:flex; justify-content:center; align-items:center; gap:34px}
@media (orientation:landscape){ .songctl{flex-direction:column; gap:20px} }
.songctl .round{width:88px; height:88px}
.fly{position:absolute; pointer-events:none; z-index:6; font-size:34px; animation:flyup 1.1s ease-out forwards}
@keyframes flyup{from{transform:translate(0,0) scale(.6); opacity:1}to{transform:translate(var(--dx,0px),-120px) scale(1.2); opacity:0}}

/* ---------- Games: a picker, then each game fills the screen ---------- */
#games{background:repeating-linear-gradient(135deg, rgba(255,255,255,.14) 0 18px, transparent 18px 36px), linear-gradient(180deg,#A5E8A2,#4FB86A)}
.gamelist{flex:1; min-height:0; display:grid; grid-template-columns:1fr; grid-auto-rows:minmax(0,1fr); gap:16px}
@media (orientation:landscape){ .gamelist{grid-template-columns:repeat(2,1fr)} }
.gamecard{position:relative; min-height:0; border-radius:30px; overflow:hidden; display:grid; place-items:center; box-shadow:var(--drop), inset 0 -8px 0 rgba(59,43,32,.14)}
.gamecard .gart{display:flex; align-items:flex-end; gap:6px; margin-bottom:34px; pointer-events:none}
.gamecard .gname{position:absolute; left:50%; bottom:12px; translate:-50% 0; background:var(--paper); border-radius:16px; padding:0 16px; font-size:22px; white-space:nowrap; box-shadow:var(--drop-sm)}
.g-wild{background:radial-gradient(circle at 84% 20%, #FFF1B8 0 26px, transparent 27px), linear-gradient(180deg,#FFD58A 0%,#FFB56B 50%,#E8A945 50%,#C98A30 100%)}
.g-wild .em{font-size:clamp(52px,min(12vh,18vw),104px)} .g-wild .em:nth-child(odd){font-size:clamp(38px,min(8vh,12vw),72px)}
.g-dino{background:linear-gradient(90deg,#A6E39A 0 50%,#A9DDF7 50% 100%)}
.g-dino .gart{align-items:center}
.g-dino .em{font-size:clamp(56px,min(13vh,19vw),108px)} .g-dino .flip{transform:scaleX(-1)}
.g-dino .gegg{width:clamp(36px,min(7vh,10vw),56px); aspect-ratio:3/4; border-radius:50% 50% 50% 50% / 60% 60% 40% 40%; background:linear-gradient(to top,#FFC83D 45%,#FFF6E0 45%); box-shadow:inset -5px -6px 0 rgba(59,43,32,.1)}
.gamecard.go{animation:hop .45s cubic-bezier(.3,1.6,.5,1)}

/* ---------- Game: Wild Tap Safari (the first game, moved in whole) ---------- */
.app.wt, .app.db{padding:0; gap:0}
.wt{--savanna:#E8A945; --dusk:#5B4A9E}
.wt-screen{position:absolute; inset:0; display:flex; flex-direction:column; padding:12px 16px 16px; gap:12px}
#wt-menu{background:radial-gradient(circle at 88% 9%, var(--sun) 0 34px, rgba(255,240,170,.8) 35px 50px, transparent 51px), linear-gradient(180deg, var(--sky) 0 72%, var(--grass) 72% 100%)}
.wt-head h1{margin:0; font-size:clamp(28px,8vw,42px); font-weight:800; line-height:1; color:#fff; text-shadow:0 3px 0 var(--ink); letter-spacing:.5px}
.wt-grid{flex:1; display:grid; grid-template-columns:1fr 1fr; grid-template-rows:repeat(3,1fr); gap:14px; min-height:0}
@media (orientation:landscape){ .wt-grid{grid-template-columns:repeat(3,1fr); grid-template-rows:1fr 1fr} }
.wt-tile{position:relative; border-radius:28px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; box-shadow:0 6px 0 rgba(59,43,32,.35); min-height:0; overflow:hidden}
.wt-tile .wt-big{font-size:clamp(46px,10vh,92px); line-height:1.05}
.wt-tile .wt-lbl{font-size:clamp(18px,4.6vw,24px); color:#fff; text-shadow:0 2px 0 rgba(59,43,32,.5)}
.wt-safari{background:linear-gradient(180deg,#FFB65C,#E8913A)}
.wt-zoo{background:linear-gradient(180deg,#5CC9B5,#2E9C8A)}
.wt-dino{background:linear-gradient(180deg,#8A6FD1,var(--dusk))}
.wt-find{background:linear-gradient(180deg,#FF8FA3,var(--berry))}
.wt-egg{background:linear-gradient(180deg,#9AD66F,#5DA545)}
.wt-bubble{background:linear-gradient(180deg,#7EC8FF,#3D8FE0)}
.wt-bar{display:flex; align-items:center; gap:12px; min-height:80px; flex:none}
.wt-back{width:80px; height:80px; border-radius:24px; background:var(--paper); display:grid; place-items:center; box-shadow:0 5px 0 rgba(59,43,32,.35); flex:none}
.wt-back svg{width:48px; height:48px}
.wt-bar h2{margin:0; font-size:clamp(26px,7vw,38px); font-weight:800; color:#fff; text-shadow:0 3px 0 rgba(59,43,32,.55); line-height:1}
.wt-w-safari{background:radial-gradient(circle at 80% 14%, #FFF1B8 0 34px, transparent 35px), linear-gradient(180deg,#FFD58A 0%,#FFB56B 34%,var(--savanna) 34%,#C98A30 100%)}
.wt-w-zoo{background:repeating-linear-gradient(90deg, transparent 0 46px, rgba(59,43,32,.12) 46px 52px), linear-gradient(180deg,var(--sky) 0 34%,#93D67F 34%,#5FAE52 100%)}
.wt-w-dino{background:radial-gradient(ellipse at 18% 34%, #FF7A3D 0 18px, transparent 19px), linear-gradient(180deg,#6B5BB8 0%,#9C82DD 34%,#4F7A3A 34%,#2F5A28 100%)}
.wt-animals{flex:1; display:grid; grid-template-columns:1fr 1fr; grid-template-rows:repeat(3,1fr); gap:12px; min-height:0}
@media (orientation:landscape){ .wt-animals{grid-template-columns:repeat(3,1fr); grid-template-rows:1fr 1fr} }
.wt-pad{position:relative; border-radius:50% 50% 44% 44% / 56% 56% 44% 44%; background:rgba(255,253,246,.55); display:grid; place-items:center; min-height:0; box-shadow:inset 0 -8px 0 rgba(59,43,32,.12)}
.wt-art{font-size:clamp(52px,12vh,116px); line-height:1; display:grid; place-items:center; pointer-events:none}
.wt-art svg{width:1.15em; height:1em; display:block}
.wt-pad.go .wt-art{animation:wt-bounce .7s cubic-bezier(.3,1.6,.5,1)}
.wt-word{position:absolute; top:4%; left:50%; translate:-50% 0; background:#fff; color:var(--ink); font-size:clamp(20px,5.5vw,30px); padding:2px 14px; border-radius:18px; box-shadow:0 4px 0 rgba(59,43,32,.25); white-space:nowrap; opacity:0; pointer-events:none; z-index:2}
.wt-pad.go .wt-word{animation:wt-pop 1.6s ease-out}
@keyframes wt-bounce{0%{transform:scale(1)}30%{transform:scale(1.32) rotate(-8deg)}55%{transform:scale(.92) rotate(6deg)}100%{transform:scale(1) rotate(0)}}
@keyframes wt-pop{0%{opacity:0; transform:scale(.4) translateY(10px)}15%{opacity:1; transform:scale(1.1)}25%{transform:scale(1)}80%{opacity:1}100%{opacity:0; transform:translateY(-14px)}}
@keyframes wt-shake{0%,100%{transform:translate(0)}20%{transform:translate(-8px,4px)}40%{transform:translate(7px,-5px)}60%{transform:translate(-6px,-3px)}80%{transform:translate(5px,5px)}}
.wt-shake{animation:wt-shake .5s linear 2}
#wt-find{background:linear-gradient(180deg,#FFD1DA 0%,#FFB3C2 100%)}
.wt-ask{flex:1; display:flex; align-items:center; justify-content:center; gap:12px; min-width:0}
.wt-ear{width:80px; height:80px; border-radius:50%; background:var(--berry); display:grid; place-items:center; box-shadow:0 5px 0 rgba(59,43,32,.35); flex:none}
.wt-ear svg{width:44px; height:44px}
.wt-q{font-size:clamp(20px,5.4vw,32px); color:var(--ink); min-width:0}
.wt-choices{flex:1; display:flex; flex-wrap:wrap; justify-content:center; align-content:center; gap:16px; min-height:0}
.wt-choice{flex:0 0 calc(50% - 8px); height:calc(50% - 8px); max-height:260px; border-radius:30px; background:var(--paper); display:grid; place-items:center; box-shadow:0 7px 0 rgba(59,43,32,.3)}
.wt-choices.n2 .wt-choice{flex-basis:min(100%,340px)}
@media (orientation:landscape){ .wt-choice{flex-basis:calc(25% - 12px); height:calc(100% - 8px)} .wt-choices.n2 .wt-choice{flex-basis:calc(40% - 8px)} }
.wt-choice .wt-art{font-size:clamp(60px,13vh,128px)}
.wt-choice.no{animation:wt-wiggle .45s}
.wt-choice.yes{background:#FFF3B0; animation:wt-bounce .7s cubic-bezier(.3,1.6,.5,1)}
@keyframes wt-wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-7deg)}75%{transform:rotate(7deg)}}
.wt-stickers{min-height:52px; flex:none; display:flex; flex-wrap:wrap; gap:4px; justify-content:center; align-items:center; background:rgba(255,253,246,.7); border-radius:20px; padding:6px 10px; font-size:30px; line-height:1; font-family:var(--emoji); font-weight:400}
.wt-stickers svg{width:1.15em; height:1em}
.wt-stickers .s{animation:wt-bounce .6s}
#wt-egg{background:radial-gradient(ellipse 46% 13% at 50% 70%, #C98A4E 0 96%, transparent 100%), linear-gradient(180deg,#BFE9FF 0 60%,#8BCB6C 60%)}
.wt-nest{flex:1; display:grid; place-items:center; position:relative; min-height:0}
.wt-eggwrap{position:relative; width:min(56vw,30vh,260px); aspect-ratio:3/4; max-width:100%}
@media (orientation:landscape){ .wt-eggwrap{width:min(28vw,27vh,200px)} }
.wt-shell{position:absolute; inset:0; border-radius:50% 50% 50% 50% / 60% 60% 40% 40%; background:var(--eggc,#F7EBD0); box-shadow:inset -14px -18px 0 rgba(59,43,32,.10), 0 10px 0 rgba(59,43,32,.15); transition:transform .6s cubic-bezier(.3,1.4,.5,1), opacity .6s}
.wt-shell::before,.wt-shell::after{content:""; position:absolute; border-radius:50%; background:var(--spot,#E8A945); opacity:.75}
.wt-shell::before{width:22%; height:16%; left:22%; top:30%}
.wt-shell::after{width:15%; height:11%; right:22%; top:55%}
.wt-top{clip-path:polygon(0 0,100% 0,100% 46%,88% 52%,76% 44%,64% 53%,52% 44%,40% 53%,28% 44%,16% 52%,0 45%)}
.wt-bottom{clip-path:polygon(0 45%,16% 52%,28% 44%,40% 53%,52% 44%,64% 53%,76% 44%,88% 52%,100% 46%,100% 100%,0 100%)}
.wt-cracks{position:absolute; inset:0; width:100%; height:100%; pointer-events:none}
.wt-cracks path{fill:none; stroke:var(--ink); stroke-width:3; stroke-linecap:round; stroke-linejoin:round; opacity:0; transition:opacity .2s}
.wt-eggwrap.wob{animation:wt-wob .4s}
@keyframes wt-wob{0%,100%{transform:rotate(0)}25%{transform:rotate(-9deg)}75%{transform:rotate(9deg)}}
.wt-eggwrap.hatched .wt-top{transform:translate(-40%,-70%) rotate(-40deg); opacity:0}
.wt-eggwrap.hatched .wt-bottom{transform:translateY(25%); opacity:0}
.wt-eggwrap.hatched .wt-cracks{opacity:0}
.wt-baby{position:absolute; inset:0; display:grid; place-items:center; font-size:clamp(76px,18vh,160px); transform:scale(0); transition:transform .6s cubic-bezier(.3,1.7,.5,1) .15s; pointer-events:none}
.wt-baby svg{width:1.15em; height:1em}
.wt-eggwrap.hatched .wt-baby{transform:scale(1)}
.wt-newegg{align-self:center; flex:none; min-height:80px; background:var(--paper); border-radius:40px; padding:10px 26px; font-size:44px; line-height:1; box-shadow:0 6px 0 rgba(59,43,32,.3); display:flex; align-items:center; gap:10px}
.wt-newegg span:last-child{font-size:24px}
#wt-bubbles{background:linear-gradient(180deg,#4FB3F0 0%,#1E6FB8 100%)}
.wt-pool{flex:1; position:relative; overflow:hidden; border-radius:24px; min-height:0}
.wt-bub{position:absolute; bottom:-160px; width:var(--sz); height:var(--sz); border-radius:50%; display:grid; place-items:center; font-size:calc(var(--sz) * .5); font-family:var(--emoji); font-weight:400;
  background:radial-gradient(circle at 32% 28%, rgba(255,255,255,.95) 0 9%, rgba(255,255,255,.25) 10% 45%, rgba(170,225,255,.35) 70%, rgba(255,255,255,.7) 100%);
  border:3px solid rgba(255,255,255,.75); animation:wt-rise var(--dur) linear forwards}
.wt-bub svg{width:1.15em; height:1em; pointer-events:none}
.wt-bub span{pointer-events:none; line-height:1}
@keyframes wt-rise{from{transform:translate(0,0)} 50%{transform:translate(var(--sway),-55vh)} to{transform:translate(0,-115vh)}}
.wt-bub.popped{animation:none; border-color:transparent; background:none}
.wt-bub.popped span,.wt-bub.popped svg{animation:wt-drop .9s ease-in forwards}
@keyframes wt-drop{0%{transform:scale(1.3)}30%{transform:scale(1.4) translateY(-20px) rotate(-10deg)}100%{transform:translateY(60vh) rotate(30deg); opacity:0}}

/* ---------- Game: Dino Buddies (the second game, moved in whole): two halves, one shared egg ---------- */
.app.db{display:grid; grid-template-rows:1fr auto 1fr; overflow:hidden; background:var(--db-sand);
  --db-jungle:#6CC46A; --db-jungle-deep:#3E9447; --db-lagoon:#5BB8E8; --db-lagoon-deep:#2F86C4; --db-sand:#F3D08A; --db-twig:#9A6436}
@media (orientation:landscape){ .app.db{grid-template-rows:none; grid-template-columns:1fr auto 1fr} }
.db-side{position:relative; overflow:hidden; display:grid; place-items:center; min-height:0; min-width:0; touch-action:none}
.db-a{background:radial-gradient(ellipse at 12% 100%, var(--db-jungle-deep) 0 22%, transparent 23%), radial-gradient(ellipse at 92% 96%, var(--db-jungle-deep) 0 18%, transparent 19%), linear-gradient(180deg,#A6E39A,var(--db-jungle))}
.db-b{background:radial-gradient(ellipse at 88% 100%, var(--db-lagoon-deep) 0 22%, transparent 23%), radial-gradient(ellipse at 8% 96%, var(--db-lagoon-deep) 0 18%, transparent 19%), linear-gradient(180deg,#A9DDF7,var(--db-lagoon))}
.db-dino{font-size:clamp(84px,22vmin,180px); line-height:1; pointer-events:none; transform-origin:50% 90%; display:grid; place-items:center}
.db-dino svg{width:1.15em; height:1em; display:block}
.db-b .db-dino{transform:scaleX(-1)}
.db-dino.db-hop{animation:db-hop .38s cubic-bezier(.3,1.6,.5,1)}
.db-b .db-dino.db-hop{animation:db-hopb .38s cubic-bezier(.3,1.6,.5,1)}
.db-dino.db-dance{animation:db-dance .5s ease-in-out 5}
.db-b .db-dino.db-dance{animation:db-danceb .5s ease-in-out 5}
@keyframes db-hop{0%{transform:scale(1,1)}35%{transform:translateY(-14%) scale(.92,1.12)}70%{transform:scale(1.1,.9)}100%{transform:scale(1,1)}}
@keyframes db-hopb{0%{transform:scaleX(-1)}35%{transform:scaleX(-1) translateY(-14%) scale(.92,1.12)}70%{transform:scaleX(-1) scale(1.1,.9)}100%{transform:scaleX(-1)}}
@keyframes db-dance{0%,100%{transform:rotate(0)}25%{transform:translateY(-18%) rotate(-12deg)}75%{transform:translateY(-18%) rotate(12deg)}}
@keyframes db-danceb{0%,100%{transform:scaleX(-1) rotate(0)}25%{transform:scaleX(-1) translateY(-18%) rotate(-12deg)}75%{transform:scaleX(-1) translateY(-18%) rotate(12deg)}}
.db-mid{position:relative; z-index:3; display:flex; align-items:center; justify-content:center; gap:14px; padding:8px 16px; background:var(--db-sand); box-shadow:0 -6px 0 rgba(59,43,32,.12) inset, 0 6px 0 rgba(59,43,32,.12) inset}
@media (orientation:landscape){ .db-mid{flex-direction:column; padding:12px 10px; box-shadow:6px 0 0 rgba(59,43,32,.12) inset, -6px 0 0 rgba(59,43,32,.12) inset} }
.db-nest{position:relative; width:clamp(104px,24vmin,160px); aspect-ratio:1/1; display:grid; place-items:end center; flex:none}
.db-nest::after{content:""; position:absolute; left:0; right:0; bottom:0; height:38%; border-radius:0 0 50% 50% / 0 0 100% 100%;
  background:repeating-linear-gradient(20deg, transparent 0 7px, rgba(59,43,32,.25) 7px 9px), repeating-linear-gradient(-25deg, transparent 0 9px, rgba(255,255,255,.18) 9px 11px), var(--db-twig); box-shadow:0 5px 0 rgba(59,43,32,.3)}
.db-egg{--p:0%; position:absolute; left:50%; bottom:16%; width:62%; aspect-ratio:3/4; translate:-50% 0; border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;
  background:linear-gradient(to top, var(--fillc,#FFC83D) var(--p), var(--eggc,#FFF6E0) var(--p)); box-shadow:inset -8px -10px 0 rgba(59,43,32,.10), 0 0 calc(var(--glow,0) * 34px) var(--fillc,#FFC83D); transition:background .25s, box-shadow .25s, opacity .3s}
.db-egg::before,.db-egg::after{content:""; position:absolute; border-radius:50%; background:rgba(59,43,32,.14)}
.db-egg::before{width:20%; height:15%; left:22%; top:24%}
.db-egg::after{width:14%; height:10%; right:22%; top:46%}
.db-egg.db-wig{animation:db-wig .25s}
.db-egg.db-gone{opacity:0}
@keyframes db-wig{0%,100%{rotate:0deg}30%{rotate:-8deg}70%{rotate:8deg}}
.db-baby{position:absolute; left:50%; bottom:20%; translate:-50% 0; font-size:clamp(64px,18vmin,120px); line-height:1; transform:scale(0); pointer-events:none; z-index:4}
.db-baby svg{width:1.15em; height:1em; display:block}
.db-baby.db-show{animation:db-born 2.6s cubic-bezier(.3,1.5,.5,1) forwards}
@keyframes db-born{0%{transform:scale(0)}18%{transform:scale(1.7) translateY(-12%)}30%{transform:scale(1.4)}80%{transform:scale(1.4)}100%{transform:scale(0) translateY(40%)}}
.db-family{display:flex; flex-wrap:wrap; justify-content:center; align-content:center; gap:2px; font-size:clamp(24px,6vmin,38px); line-height:1; min-width:0; flex:1; font-family:var(--emoji); font-weight:400}
@media (orientation:landscape){ .db-family{flex:none; max-height:calc(100% - 190px); width:clamp(70px,16vmin,104px); overflow:hidden} }
.db-family span{display:inline-grid; place-items:center; animation:db-arrive .5s cubic-bezier(.3,1.6,.5,1)}
.db-family svg{width:1.15em; height:1em}
@keyframes db-arrive{from{transform:scale(0)}}
.db-treat{position:absolute; left:0; top:0; width:56px; height:56px; display:grid; place-items:center; font-size:44px; line-height:1; pointer-events:none; z-index:6; will-change:transform; font-family:var(--emoji); font-weight:400}

/* ---------- Parent settings ---------- */
#settings{position:absolute; inset:0; z-index:50; display:grid; place-items:center; padding:12px; background:rgba(59,43,32,.5)}
.sheet{width:min(100%,470px); max-height:100%; overflow-y:auto; touch-action:pan-y; overscroll-behavior:contain; -webkit-overflow-scrolling:touch;
  background:var(--paper); border-radius:24px; padding:16px 18px; box-shadow:var(--drop); font-weight:600; font-size:17px; -webkit-user-select:none; user-select:none}
.shead{position:sticky; top:-16px; z-index:1; display:flex; align-items:center; justify-content:space-between; gap:12px; margin:-16px -18px 0; padding:12px 18px 10px; background:var(--paper); border-radius:24px 24px 0 0}
.sheet h2{margin:0; font-size:24px; font-weight:800}
.srow{display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px 12px; padding:10px 0; border-top:2px dashed rgba(59,43,32,.14)}
.srow > span{font-weight:800}
.seg{display:flex; gap:6px; flex-wrap:wrap}
.sbtn{min-height:48px; min-width:56px; padding:0 14px; border-radius:14px; background:var(--cream); box-shadow:var(--drop-sm); font-weight:800; font-size:17px}
.sbtn.on{background:var(--sun); box-shadow:0 0 0 3px var(--ink), var(--drop-sm)}
.sbtn.danger{background:var(--stop); color:#fff}
.sbtn.done{background:var(--go); color:#fff; padding:0 22px}
.sbtn:disabled{opacity:.45}
.confirm{display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding:10px; margin-bottom:6px; border-radius:14px; background:#FFE1E1}
.note{margin:4px 0 8px; font-size:14px; color:#6A5848; line-height:1.35}

/* ---------- Bursts ---------- */
.conf{position:absolute; width:14px; height:14px; border-radius:4px; pointer-events:none; z-index:60; animation:burst 1.1s cubic-bezier(.2,.7,.4,1) forwards}
@keyframes burst{from{transform:translate(0,0) rotate(0)}to{transform:translate(var(--dx),var(--dy)) rotate(540deg); opacity:0}}
.ring{position:absolute; width:20px; height:20px; margin:-10px 0 0 -10px; border-radius:50%; border:4px solid #fff; pointer-events:none; z-index:55; animation:ring .45s ease-out forwards}
@keyframes ring{to{transform:scale(5); opacity:0}}

@media (prefers-reduced-motion:reduce){ *{animation-duration:.01ms!important; transition-duration:.01ms!important} .wt-bub{animation-duration:var(--dur)!important} }
</style>

<body>

      <!-- CAMERA -->

  ribbit(at=0){ [[0,280],[.2,340]].forEach(([d, f]) => vox({at:at+d, vol:.5, f0:[[0,f],[.12,f*.92]], amp:[[0,0],[.02,1],[.12,0]], form:[{f:800, q:4}, {f:1900, q:5, g:.4}], rough:1, roughHz:60, noise:.1})); return at + .35; },
  hoot(at=0){ [[0,.24],[.36,.16],[.6,.45]].forEach(([d, len]) => vox({at:at+d, type:'triangle', vol:.2, f0:[[0,410],[len,370]], amp:[[0,0],[.05,1],[len,0]], form:[{f:420, q:3}, {f:800, q:4, g:.2}], noise:.12})); return at + 1.05; },
  yawn(at=0){ return vox({at, type:'triangle', vol:.15, f0:[[0,1400],[.2,2200],[.55,1500]], amp:[[0,0],[.08,1],[.55,0]], form:[{f:2000, q:2}], vib:40, vibHz:6, noise:.05}); },   // sloth: a high, whistly "ah-eee"
  moo(at=0){ return vox({at, vol:.42, f0:[[0,118],[.2,135],[.9,112],[1.1,96]], amp:[[0,0],[.15,.9],[.85,.8],[1.1,0]], form:[{f:[[0,260],[.3,560],[1.1,430]], q:4}, {f:[[0,800],[.3,950],[1.1,850]], q:5, g:.4}], rough:.3, roughHz:25, noise:.2}); },
  tweet(at=0){ tone(2000,2700,.08,'sine',.16,at); tone(2200,2900,.08,'sine',.16,at+.12); tone(2000,2800,.1,'sine',.14,at+.26); return at + .36; },
  flutter(at=0){ [0,.07,.14,.21].forEach(d => noise(.05,'bandpass',1800,1400,.16,at+d)); return at + .26; },
  flick(at=0){ tone(1400,2400,.05,'sine',.15,at); tone(1400,2400,.05,'sine',.15,at+.1); return at + .15; },
  snap(at=0){ noise(.05,'highpass',2500,2000,.36,at); noise(.05,'highpass',2500,2000,.36,at+.16); return at + .21; },
  peep(at=0){ [0,.15,.3].forEach(d => tone(2600,3300,.09,'sine',.16,at+d)); return at + .4; },
  boing(at=0){ [0,.3,.6].forEach(d => tone(180,620,.25,'sine',.3,at+d)); return at + .85; },
  boom(at=0){ noise(1.6,'lowpass',320,60,.7,at); tone(60,30,1.4,'sine',.6,at); return at + 1.6; },

/* Real recordings win: list them in assets/sounds/sounds.json (see the README there) and that animal plays the file instead. */
const SOUND_FILES = {}, soundBufs = {};
async function loadSounds(){
  try{
    if (location.protocol === 'file:') return;
    const r = await fetch('assets/sounds/sounds.json', {cache:'no-cache'});
    if (!r.ok) return;
    const j = await r.json();
    Object.entries(j || {}).forEach(([id, f]) => {
      if (typeof f !== 'string') return;
      const url = /^(data:|blob:|https?:|\/)/.test(f) ? f : 'assets/sounds/' + f;
      SOUND_FILES[id] = url; loadClip(url).then(buf => { if (buf) soundBufs[id] = buf; });
    });
  }catch(e){}
}
function animalSound(a, at=0){
  const buf = a.id && soundBufs[a.id];
  if (buf && ctx){ const s = ctx.createBufferSource(); s.buffer = buf; s.connect(OUT || master); s.start(ctx.currentTime + at); return at + buf.duration; }
  return (a.fx && FX[a.fx]) ? (FX[a.fx](at) || at + .8) : at;
}

/* ---------- Speech ---------- */
let voice = null, speechReady = false, pending = null;
/* Best English voice the phone offers: a downloaded Premium or Enhanced voice beats the basic built-in one. */
const voiceTier = v => { const t = (v.name + ' ' + v.voiceURI).toLowerCase(); return t.includes('premium') ? 2 : t.includes('enhanced') ? 1 : 0; };
function pickVoice(){
  try{
    const score = v => voiceTier(v)*10 + (/samantha|karen|moira|ava|zoe|google us/i.test(v.name) ? 4 : 0) + (/en-US/i.test(v.lang) ? 2 : 0) + (v.localService ? 1 : 0);
    voice = speechSynthesis.getVoices().filter(v => /^en/i.test(v.lang)).sort((x, y) => score(y) - score(x))[0] || null;
    const vn = $('#voiceNote');
    if (vn) vn.textContent = voice && voiceTier(voice)
      ? `Voice: ${voice.name}${/enhanced|premium/i.test(voice.name) ? '' : voiceTier(voice) > 1 ? ' (Premium)' : ' (Enhanced)'}. That's the natural-sounding kind.`
      : `Voice: ${voice ? voice.name : 'device default'}, the basic built-in version. For a more natural voice, download an Enhanced or Premium English voice in Settings → Accessibility → Read & Speak → Voices (called Spoken Content on iOS 18 and earlier), then reload this page.`;
  }catch(e){}
}
try{ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }catch(e){}
/* The phone's voice reads ALL-CAPS words letter by letter ("R-O-A-R") and stumbles on stretched made-up words,
   so every line is cleaned first: sound words get spellings it says right, caps go lowercase, "Wheee" becomes "Whee". */
const SAY_AS = [[/\b(?:r+o+a+r+|rawr)\b/gi, 'roar'], [/\bpa+-?o+\b/gi, 'pawoo'], [/\bgr{2,}\b/gi, 'grr'], [/\bhr+umph\b/gi, 'harrumph'], [/\bmwah\b/gi, 'smooch']];
function speakable(text){
  let t = String(text).replace(/\b[A-Z]{2,}\b/g, w => w.toLowerCase());
  SAY_AS.forEach(([re, w]) => { t = t.replace(re, m => m[0] === m[0].toUpperCase() ? w[0].toUpperCase() + w.slice(1) : w); });
  return t.replace(/([a-z])\1{2,}/gi, '$1$1');
}
function speakNow(text, pitch){
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(speakable(text));
    if (voice){ u.voice = voice; u.lang = voice.lang; }
    u.rate = .9; u.pitch = pitch || 1.15; u.volume = Math.min(1, VOLS[settings.vol] + .3);
    speechSynthesis.speak(u);
  }catch(e){}
}
function say(text, pitch){ if (speechReady) speakNow(text, pitch); else pending = [text, pitch]; }
function hush(){ pending = null; try{ speechSynthesis.cancel(); }catch(e){} }
const talkMs = text => 900 + text.length * 68;   // rough speaking time at rate .9

/* iPhone only unlocks sound and speech when a finger lifts (touchend/click, not pointerdown),
   so unlock there. Sounds and words queued by the first pointerdown play right then. */
let unlocked = false;
function unlock(){
  audio();
  if (!speechReady){
    speechReady = true;
    const p = pending; pending = null;
    if (p) speakNow(p[0], p[1]); else speakNow('Hi buddy! It\'s your phone!');
  }
  if (!unlocked){ unlocked = true; scheduleIncoming(); }
}
document.addEventListener('touchend', unlock, {capture:true, passive:true});
document.addEventListener('click', unlock, true);

/* keep the screen awake while playing (ignored where not allowed) */
let wake = null;
async function keepAwake(){ try{ if (!wake && navigator.wakeLock){ wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => wake = null); } }catch(e){} }

/* ---------- Tap helpers ---------- */
/* pointerdown answers right away; a palm-mash on one target counts as one tap per ~110ms */
function tap(el, fn, {throttle=110, bump=true} = {}){
  let last = 0;
  el.addEventListener('pointerdown', e => {
    e.preventDefault(); keepAwake();
    const now = performance.now();
    if (now - last < throttle) return;
    last = now;
    if (bump) retrigger(el, 'bump');
    fn(e);
  });
}
/* For things inside a scroll list: feedback on down, action on lift (so a scroll is not a tap). */
function tapInScroll(el, fn){
  let down = null;
  el.addEventListener('pointerdown', e => { keepAwake(); down = {id:e.pointerId, x:e.clientX, y:e.clientY}; retrigger(el, 'bump'); FX.pop(); });
  el.addEventListener('pointermove', e => { if (down && e.pointerId === down.id && Math.hypot(e.clientX-down.x, e.clientY-down.y) > 14) down = null; });
  el.addEventListener('pointerup', e => { if (down && e.pointerId === down.id){ down = null; fn(e); } });
  el.addEventListener('pointercancel', () => down = null);
}
/* Instruments: tap a bar or key, or slide a finger across them (works with many fingers at once). */
function playField(box, sel, hit){
  const lastEl = new Map(), lastAt = new WeakMap();
  const fire = (el, e) => { const now = performance.now(); if (now - (lastAt.get(el) || 0) < 110) return; lastAt.set(el, now); hit(el, e); };
  box.addEventListener('pointerdown', e => {
    e.preventDefault(); keepAwake();
    const el = e.target.closest(sel); if (!el || !box.contains(el)) return;
    lastEl.set(e.pointerId, el); fire(el, e);
  });
  box.addEventListener('pointermove', e => {
    if (!lastEl.has(e.pointerId)) return;
    const under = document.elementFromPoint(e.clientX, e.clientY);
    const el = under && under.closest(sel);
    if (el && box.contains(el) && el !== lastEl.get(e.pointerId)){ lastEl.set(e.pointerId, el); fire(el, e); }
  });
  ['pointerup','pointercancel'].forEach(t => box.addEventListener(t, e => lastEl.delete(e.pointerId)));
}

/* choose the column count that makes each portrait as big as possible */
function fitContacts(){
  const box = $('#contacts'); if (box.hidden || !box.clientWidth) return;
  const n = CONTACTS.length, gap = 10, W = box.clientWidth, H = box.clientHeight;
  let best = {size:0};
  for (let cols=1; cols<=n; cols++){
    const rows = Math.ceil(n/cols), w = (W - gap*(cols-1))/cols, h = (H - gap*(rows-1))/rows;
    const size = Math.min(w - 8, h - 34);
    if (size > best.size) best = {cols, rows, size};
  }
  box.style.gridTemplateColumns = `repeat(${best.cols},1fr)`; box.style.gridTemplateRows = `repeat(${best.rows},minmax(0,1fr))`;

}

function callLater(fn, ms){ if (!call) return; const c = call; const id = setTimeout(() => { c.timers.delete(id); if (call === c) fn(); }, ms); c.timers.add(id); }

  $('#hangupBtn').hidden = s === 'ringing';

let incomingTimer = null, incomingDue = false;

  clearTimeout(incomingTimer); incomingDue = false;

  incomingTimer = setTimeout(() => { incomingDue = true; maybeRing(); }, (60 + Math.random()*120) * 1000);
}

    [784, 988, 1175, 988, 784, 988, 1175, 1568].forEach((f, i) => { tone(f, f, .24, 'triangle', .12, i*.13); tone(f*2, f*2, .1, 'sine', .025, i*.13); });

const ease = k => k < .5 ? 2*k*k : 1 - Math.pow(-2*k + 2, 2)/2;
function upAmt(a, t){
  if (a.upUntil && a.upUntil > t) return 1;
  const p = ((t / a.period) + a.phase) % 1;
  if (p < .1 || p > .92) return 0;
  if (p < .28) return ease((p - .1)/.18);
  if (p > .74) return ease((.92 - p)/.18);
  return 1;
}
function pose(a, t, allUp){
  let x = a.x, y = a.y, rot = a.rot || 0, flip = false;
  switch (a.m){
    case 'walk': { const span = a.x1 - a.x0, d = (t*a.speed + a.phase*2*span) % (2*span), fwd = d < span; x = a.x0 + (fwd ? d : 2*span - d); flip = fwd; y -= Math.abs(Math.sin(t*5))*7; break; }
    case 'peek': y += allUp ? 0 : a.amp * (1 - upAmt(a, t)); break;
    case 'bob': y += Math.sin(t*a.speed + (a.phase || 0)) * a.amp; break;
    case 'stomp': y -= Math.abs(Math.sin(t*2.2 + a.phase)) * a.amp; break;
    case 'sway': rot += Math.sin(t*a.speed + (a.phase || 0)) * a.amp; break;
    case 'fly': { const s = t*a.speed + a.phase; x = a.x + Math.sin(s)*a.range; y += Math.sin(s*5)*26; flip = Math.cos(s) > 0; break; }
    case 'swing': { rot = Math.sin(t*a.speed) * a.amp; x = a.px + Math.sin(rot)*a.len; y = a.py + Math.cos(rot)*a.len + a.size*.55; break; }
    case 'hop': { const p = ((t / a.period) + a.phase) % 1; if (!allUp && p < .22) y -= Math.sin(p/.22*Math.PI) * a.amp; break; }
  }
  if (a.hopT != null){ const k = (t - a.hopT) / .5; if (k >= 0 && k < 1) y -= Math.sin(k*Math.PI) * 42; }
  return {x, y, rot, flip};
}
/* the part of an animal you can actually see (not behind grass, water or leaves) */
function visBox(a, ps){
  const s = a.size, top = Math.max(ps.y - s, a.hideAbove ?? -1e9), bot = Math.min(ps.y, a.hideBelow ?? 1e9);
  return {x0:ps.x - s*.45, x1:ps.x + s*.45, y0:top, y1:bot, h:Math.max(0, bot - top)};
}
function drawArt(g, art, s){
  if (isSvg(art)){ const im = svgImg(art); if (im.ready) g.drawImage(im, -s/2, -s*.333, s, s*.833); }
  else { g.fillStyle = '#000'; g.font = `${Math.round(s*.86)}px ${EMOJI_FONT}`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(art, 0, s*.04); }   // opaque fill: emoji take the fill's alpha
}
function drawAnimal(g, a, ps){
  if (a.m === 'swing'){ g.strokeStyle = '#3E8A3A'; g.lineWidth = 8; g.lineCap = 'round'; g.beginPath(); g.moveTo(a.px, a.py); g.lineTo(ps.x, ps.y - a.size*.85); g.stroke(); }
  g.save(); g.translate(ps.x, ps.y - a.size/2);
  if (ps.rot) g.rotate(ps.rot);
  if (ps.flip) g.scale(-1, 1);
  drawArt(g, a.a, a.size);
  g.restore();
}
/* draw the world so that world point (vx,vy) lands at the canvas top-left, s canvas px per world unit */
function renderScene(g, sc, vx, vy, s, w, h, t, allUp){
  g.setTransform(s, 0, 0, s, -vx*s, -vy*s);
  const vw = w/s, vh = h/s;
  let gr = g.createLinearGradient(0, 0, 0, sc.horizon); gr.addColorStop(0, sc.sky[0]); gr.addColorStop(1, sc.sky[1]);
  g.fillStyle = gr; g.fillRect(vx - 2, vy - 2, vw + 4, vh + 4);
  gr = g.createLinearGradient(0, sc.horizon, 0, WH); gr.addColorStop(0, sc.ground[0]); gr.addColorStop(1, sc.ground[1]);
  g.fillStyle = gr; g.fillRect(vx - 2, sc.horizon, vw + 4, WH - sc.horizon + 2);
  for (const it of sc.items){
    if (it.p){ PROP[it.p.k](g, it.p, t); continue; }
    const a = it.a, ps = pose(a, t, allUp);
    if (ps.x + a.size < vx || ps.x - a.size > vx + vw) continue;
    drawAnimal(g, a, ps);
  }
}
/* which animals are in a crop of the world */
function inShot(sc, x0, y0, vw, vh, t, allUp){
  const out = [];
  sc.animals.forEach(a => {
    const b = visBox(a, pose(a, t, allUp));
    if (b.h < Math.max(.3*a.size, 22)) return;
    const ix = Math.max(0, Math.min(b.x1, x0 + vw) - Math.max(b.x0, x0)), iy = Math.max(0, Math.min(b.y1, y0 + vh) - Math.max(b.y0, y0));
    if (ix * iy >= .4 * (b.x1 - b.x0) * b.h) out.push({a, x:(b.x0 + b.x1)/2});
  });
  return out.sort((u, v) => u.x - v.x).map(o => o.a);
}
const article = n => (/^[aeiou]/i.test(n) ? 'an ' : 'a ') + n;
function listWords(words){ return words.length < 2 ? words.join('') : words.slice(0, -1).join(', ') + ' and ' + words[words.length-1]; }
function photoLine(names){
  if (!names || !names.length) return rnd(['What a pretty picture!', 'Ooh, a nice picture!', 'I love this picture!']);
  return listWords(names.slice(0, 4).map(article)).replace(/^./, ch => ch.toUpperCase()) + '!';
}

function sizeCamera(){

let drag = null;
vf.addEventListener('pointerdown', e => {
  e.preventDefault(); keepAwake();
  const [rx, ry] = relPt(e); ripple(rx, ry);
  if (drag) return;
  drag = {id:e.pointerId, x0:e.clientX, y0:e.clientY, lx:e.clientX, ly:e.clientY, lt:performance.now(), moved:false, vx:0, vy:0};
  cam.vx = cam.vy = 0;
});
vf.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  const s = camScale(), now = performance.now(), dt = Math.max(8, now - drag.lt);
  const dx = e.clientX - drag.lx, dy = e.clientY - drag.ly;
  cam.x -= dx / s; cam.y -= dy / s; clampCam();
  drag.vx = .6*drag.vx + .4*(-dx/s/dt); drag.vy = .6*drag.vy + .4*(-dy/s/dt);
  drag.lx = e.clientX; drag.ly = e.clientY; drag.lt = now;
  if (Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) > 14) drag.moved = true;
});

}

/* An index in one key, each JPEG in its own key. At most 40; the oldest goes first when full. */
const MAX_PHOTOS = 40;
const mem = new Map();   // fallback when the phone refuses storage
const Photos = {
  list: (store.get('photos', []) || []).filter(p => p && p.id),
  src(id){ if (mem.has(id)) return mem.get(id); try{ return localStorage.getItem('toyphone.photo.' + id); }catch(e){ return null; } },
  saveIndex(){ store.set('photos', this.list); },
  dropOldest(){ const old = this.list.pop(); if (!old) return false; mem.delete(old.id); try{ localStorage.removeItem('toyphone.photo.' + old.id); }catch(e){} this.saveIndex(); return true; },
  add(src, meta){
    const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    while (this.list.length >= MAX_PHOTOS) this.dropOldest();
    for (;;){
      try{ localStorage.setItem('toyphone.photo.' + id, src); break; }
      catch(e){ if (!this.dropOldest()){ mem.set(id, src); break; } }
    }
    this.list.unshift({id, t:Date.now(), ...meta});
    if (!store.set('photos', this.list)){ this.dropOldest(); this.saveIndex(); }
  },
  clear(){ this.list.forEach(p => { try{ localStorage.removeItem('toyphone.photo.' + p.id); }catch(e){} }); this.list = []; mem.clear(); this.saveIndex(); }
};
function openPhotos(){
  renderGrid();

const NOTE_I = {C:0, D:2, E:4, F:5, G:7, A:9, B:11};
function noteFreq(name){ const m = /^([A-G])(#|b)?(\d)$/.exec(name); if (!m) return 0; const midi = 12*(+m[3] + 1) + NOTE_I[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0); return 440 * Math.pow(2, (midi - 69)/12) * 2; }   // one octave up: bright toy-glockenspiel range
function parseSong(s){ return s.notes.trim().split(/\s+/).map(tok => { const [main, voice] = tok.split('~'); const [nm, beats] = main.split(':'); return {nm, beats:beats ? parseFloat(beats) : 1, voice}; }); }

function playSong(s){
  stopSong(); markSong(s);
  say(s.n + '!');
  const timers = [];
  song = {s, bus:null, timers};
  timers.push(setTimeout(() => {
    if (!song || song.s !== s) return;
    song.bus = makeBus(); const beat = 60 / s.bpm; let at = .1, side = 0;
    into(song.bus, () => parseSong(s).forEach(n => {
      const dur = n.beats * beat;
      if (n.nm === 'X'){ [0,.012,.026].forEach(d => noise(.04,'bandpass',1600,1400,.4,at + d)); timers.push(setTimeout(() => { retrigger(dancer, 'bow'); const [x, y] = rel(dancer); flyNote(x, y - 40, '👏'); }, at*1000)); }
      else if (n.nm !== 'R'){
        const f = noteFreq(n.nm);
        if (n.voice === 'moo') synth({f:f*.25, f1:f*.24, dur:Math.max(.3, dur*.95), type:'sawtooth', vol:.15, lp:700, vib:5, atk:.06, at});
        else { synth({f, dur:Math.max(.18, dur*.92), type:'triangle', vol:.17, rel:.08, at}); synth({f:f*2, dur:.14, vol:.05, at}); }
        const sd = side++ % 2;
        timers.push(setTimeout(() => { dancer.classList.remove('l','r','bow'); dancer.classList.add(sd ? 'r' : 'l'); if (Math.random() < .35){ const [x, y] = rel(dancer); flyNote(x + (Math.random() - .5)*120, y - 60); } }, at*1000));
      }
      at += dur;
    }));
    timers.push(setTimeout(() => { if (!song || song.s !== s) return; dancer.classList.remove('l','r'); retrigger(dancer, 'bow'); FX.cheer(); const [x, y] = rel(dancer); confetti(x, y, 30); song = null; later(() => say('Yay! Great dancing!'), 500); }, (at + .3)*1000));
  }, 1700));
}

    } else {
      retrigger(el, 'no'); FX.boop();
      later(() => say('That’s the ' + spoken(a) + '. Can you find the ' + spoken(target) + '?'), 150);
    }
  }
  function addSticker(a){
    const st = $('#wtStickers');
    if (stickerCount >= 10){ st.innerHTML = ''; stickerCount = 0; }
    const s = document.createElement('span'); s.className = 's'; put(s, a.a); st.appendChild(s); stickerCount++;
    if (stickerCount === 10) later(() => { const [x, y] = rel(st); confetti(x, y, 40); FX.cheer(); say('Wow! Ten animals! You are a super explorer!'); }, 900);
  }

  const EGGS = [['#F7EBD0','#E8A945'],['#D9F2C6','#5DA545'],['#DDEBFF','#3D8FE0'],['#FFE0E7','#E8506E'],['#EDE3FF','#8A6FD1']];
  let cracks = 0, hatched = false;
  const eggwrap = $('#wtEggwrap');
  function newEgg(){
    cracks = 0; hatched = false;
    const [c, s] = rnd(EGGS);
    eggwrap.style.setProperty('--eggc', c); eggwrap.style.setProperty('--spot', s);
    eggwrap.classList.remove('hatched', 'wob');
    $$('.wt-cracks path', eggwrap).forEach(p => p.style.opacity = 0);
    $('#wtBaby').innerHTML = '';
    $('#wtNewegg').hidden = true;
  }
  tap(eggwrap, () => {
    if (hatched) return;
    retrigger(eggwrap, 'wob'); FX.crack();
    const paths = $$('.wt-cracks path', eggwrap);
    if (cracks < paths.length) paths[cracks].style.opacity = 1;
    cracks++;
    if (cracks === 2) say('Crack!');
    if (cracks > paths.length){
      hatched = true;
      const b = rnd(HATCH);
      put($('#wtBaby'), b.a);
      eggwrap.classList.add('hatched'); FX.cheer();
      const [x, y] = rel(eggwrap); confetti(x, y, 34);
      later(() => say(b.s || ('It’s a baby ' + spoken(b) + '!')), 400);
      later(() => { $('#wtNewegg').hidden = false; }, 1200);
    }
  }, {bump:false});
  tap($('#wtNewegg'), () => { FX.pop(); newEgg(); });

  let bubTimer = null;
  const BUB_ART = [...ALL.map(a => a.a), '🐠','🐙','🐳','🦀'];
  function spawnBubble(){
    const pool = $('#wtPool');
    if (pool.querySelectorAll('.wt-bub:not(.popped)').length >= 7) return;
    const b = document.createElement('div'); b.className = 'wt-bub';
    const sz = 90 + Math.random()*60, w = pool.clientWidth;
    b.style.setProperty('--sz', sz + 'px');
    b.style.setProperty('--dur', (6 + Math.random()*4) + 's');
    b.style.setProperty('--sway', ((Math.random() - .5)*80) + 'px');
    b.style.left = Math.max(0, Math.random()*(w - sz)) + 'px';
    const art = rnd(BUB_ART);
    if (isSvg(art)) b.innerHTML = art; else { const s = document.createElement('span'); s.textContent = art; b.appendChild(s); }
    b.addEventListener('pointerdown', e => {
      e.preventDefault(); keepAwake();
      if (b.classList.contains('popped')) return;
      const r = b.getBoundingClientRect(), pr = pool.getBoundingClientRect(), [x, y] = rel(b);
      b.style.animation = 'none'; b.style.bottom = 'auto';
      b.style.left = (r.left - pr.left) + 'px'; b.style.top = (r.top - pr.top) + 'px';
      b.classList.add('popped'); FX.pop(); ripple(x, y);
      setTimeout(() => b.remove(), 950);
    });
    b.addEventListener('animationend', ev => { if (ev.target === b) b.remove(); });
    pool.appendChild(b);
  }
  function startBubbles(){ stopBubbles(); for (let i=0;i<3;i++) later(spawnBubble, i*350); bubTimer = setInterval(spawnBubble, 1100); }
  function stopBubbles(){ clearInterval(bubTimer); bubTimer = null; $('#wtPool').innerHTML = ''; }

  return {
    enter(){ show('menu'); say('Wild Tap! Pick one!'); },
    leave(){ stopBubbles(); }
  };
})();

/* ---------- Dino Buddies: two kids, one half each; every tap flies a treat into the shared egg ---------- */
const DinoBuddies = (() => {
  const DINOS = [{n:'T rex', a:'🦖'}, {n:'long neck', a:'🦕'}, {n:'Triceratops', a:SVG.trike}, {n:'Stegosaurus', a:SVG.stego}, {n:'Pterodactyl', a:SVG.ptero}];
  const TREATS = ['⭐','🌟','💛','💚','🍓','🫐','🍃','🌸','🍉','🍌'];
  const EGGS = [['#FFF6E0','#FFC83D'],['#EAF7DF','#7CC96B'],['#E3F1FF','#5BB8E8'],['#FFE6EC','#F27A93'],['#F0E8FF','#9C82DD']];
  const GOAL = 24;
  const root = $('#dinobuddies'), eggEl = $('#dbEgg'), babyEl = $('#dbBaby'), famEl = $('#dbFamily');
  const sides = $$('.db-side', root), dinoEls = sides.map(s => s.querySelector('.db-dino'));
  const saved = store.get('dinobuddies', {}) || {};   // the hatched family is remembered between visits
  let fill = 0, hatching = false, buddy = DINOS[clamp(saved.buddy | 0, 0, DINOS.length - 1)];
  let family = Array.isArray(saved.family) ? saved.family.filter(i => DINOS[i]).slice(0, 8) : [];
  const lastTap = [0, 0];
  /* each side plays its own instrument on the same pentatonic scale, so two kids mashing at once still sounds like music */
  const PENTA = [262,294,330,392,440,523,587,659,784,880], step = [0, 4];
  function note(side){
    const i = step[side] % PENTA.length;
    step[side] += Math.random() < .75 ? 1 : 2;
    if (side === 0){ tone(PENTA[i]*.5, PENTA[i]*.5, .35, 'triangle', .32); tone(PENTA[i], PENTA[i], .2, 'sine', .08); }
    else { tone(PENTA[i], PENTA[i], .45, 'sine', .22); tone(PENTA[i]*2, PENTA[i]*2, .18, 'sine', .05); }
  }
  const tink = () => tone(1568, 1760, .08, 'sine', .07);
  const crack = () => noise(.12, 'highpass', 4000, 2000, .3);
  const cheer = () => { [523,659,784,1047,1319].forEach((f, i) => tone(f, f, .3, 'triangle', .2, i*.1)); noise(.6, 'lowpass', 300, 120, .25); };
  function setBuddy(d){ buddy = d; dinoEls.forEach(el => put(el, d.a)); }
  function newEgg(){ const [c, f] = rnd(EGGS); eggEl.style.setProperty('--eggc', c); eggEl.style.setProperty('--fillc', f); fill = 0; drawEgg(); eggEl.classList.remove('db-gone'); }
  function drawEgg(){
    const p = Math.min(1, fill / GOAL);
    eggEl.style.setProperty('--p', (p === 0 ? 0 : 27 + p*73).toFixed(1) + '%');   // the bottom ~27% sits behind the nest
    eggEl.style.setProperty('--glow', p.toFixed(2));
  }
  function renderFamily(){ famEl.innerHTML = ''; family.forEach(i => { const s = document.createElement('span'); put(s, DINOS[i].a); famEl.appendChild(s); }); }
  const centerOf = el => { const r = el.getBoundingClientRect(), a = root.getBoundingClientRect(); return [r.left - a.left + r.width/2, r.top - a.top + r.height/2]; };
  sides.forEach((side, s) => {
    side.addEventListener('pointerdown', e => {
      e.preventDefault(); keepAwake();
      const now = performance.now();
      if (now - lastTap[s] < 110) return;   // a palm-mash counts as one tap, not ten
      lastTap[s] = now;
      const a = root.getBoundingClientRect();
      note(s);
      if (!hatching) retrigger(dinoEls[s], 'db-hop');
      const [rx, ry] = relPt(e); ripple(rx, ry);
      flyTreat(e.clientX - a.left, e.clientY - a.top);
    });
  });
  function flyTreat(x, y){
    const t = document.createElement('div'); t.className = 'db-treat'; t.textContent = rnd(TREATS);
    root.appendChild(t);
    const [nx, ny] = centerOf(eggEl);
    const mx = (x + nx)/2 + (Math.random() - .5)*80, my = Math.min(y, ny) - 40;
    const anim = t.animate([
      {transform:`translate(${x-28}px,${y-28}px) scale(.2)`},
      {transform:`translate(${x-28}px,${y-48}px) scale(1.25)`, offset:.22},
      {transform:`translate(${mx-28}px,${my-28}px) scale(.9)`, offset:.6},
      {transform:`translate(${nx-28}px,${ny-28}px) scale(.3)`}
    ], {duration:750, easing:'ease-in-out', fill:'forwards'});
    anim.onfinish = () => { t.remove(); land(); };
  }
  function land(){
    if (hatching || current !== 'dinobuddies') return;
    fill++; drawEgg(); tink(); retrigger(eggEl, 'db-wig');
    if (fill === Math.round(GOAL/2)) crack();
    if (fill >= GOAL) hatch();
  }
  function hatch(){
    hatching = true; crack(); cheer();
    const i = Math.floor(Math.random()*DINOS.length), d = DINOS[i];
    eggEl.classList.add('db-gone');
    put(babyEl, d.a); retrigger(babyEl, 'db-show');
    const [x, y] = rel(eggEl); confetti(x, y, 36);
    sides.forEach(sd => { const [cx, cy] = rel(sd); confetti(cx, cy, 18); });
    dinoEls.forEach(el => retrigger(el, 'db-dance'));
    say(rnd(['Hooray! Teamwork!','You did it together!','Yay, buddies!']) + ' A baby ' + d.n + '!');
    setTimeout(() => {
      family.push(i); if (family.length > 8) family = [i];
      renderFamily(); setBuddy(d); store.set('dinobuddies', {family, buddy:i});
      dinoEls.forEach(el => el.classList.remove('db-dance'));
      newEgg(); hatching = false;
    }, 2700);
  }
  setBuddy(buddy); newEgg(); renderFamily();
  return {
    enter(){ say('Dino Buddies! Tap tap tap! Help the egg hatch!'); },
    leave(){ $$('.db-treat', root).forEach(t => t.remove()); },
    fill: () => fill, family: () => family.length
  };
})();

/* ======================= PARENT SETTINGS ======================= */
/* hidden behind a 3-second press on the clock; a quick tap just wiggles it */
const clock = $('#clock');
let holdT = 0, holdShow = 0;
function clearHold(){ clearTimeout(holdT); clearTimeout(holdShow); clock.classList.remove('holding'); }
clock.addEventListener('pointerdown', e => {
  e.preventDefault(); clearHold(); retrigger(clock, 'wig'); FX.tick();
  holdShow = setTimeout(() => clock.classList.add('holding'), 600);
  holdT = setTimeout(() => { clearHold(); openSettings(); }, 3000);
});
['pointerup','pointercancel','pointerleave'].forEach(t => clock.addEventListener(t, clearHold));
const volSeg = $('#volSeg');
['Quiet','Soft','Medium','Loud'].forEach((l, i) => { const b = document.createElement('button'); b.className = 'sbtn'; b.textContent = l; b.dataset.vol = i; volSeg.appendChild(b); });
function renderSettings(){
  $$('[data-incoming]').forEach(b => b.classList.toggle('on', (b.dataset.incoming === '1') === settings.incoming));
  $$('[data-vol]').forEach(b => b.classList.toggle('on', +b.dataset.vol === settings.vol));
  const n = Photos.list.length; $('#photoCount').textContent = n + (n === 1 ? ' photo' : ' photos');
  $('#clearBtn').disabled = !n;
}
function openSettings(){ hush(); $('#confirmClear').hidden = true; renderSettings(); pickVoice(); $('#settings').hidden = false; FX.cheer(); }
function closeSettings(){ $('#settings').hidden = true; }
$$('[data-incoming]').forEach(b => tap(b, () => { settings.incoming = b.dataset.incoming === '1'; saveSettings(); renderSettings(); scheduleIncoming(); }));
$$('[data-vol]').forEach(b => tap(b, () => { settings.vol = +b.dataset.vol; saveSettings(); if (master) master.gain.value = VOLS[settings.vol]; renderSettings(); FX.cheer(); }));
tap($('#clearBtn'), () => { if (Photos.list.length) $('#confirmClear').hidden = false; });
tap($('#noClear'), () => { $('#confirmClear').hidden = true; });
tap($('#yesClear'), () => { Photos.clear(); store.set('seeded', true); $('#confirmClear').hidden = true; renderSettings(); if (current === 'photos'){ closeViewer(true); renderGrid(); } showThumb(); });
tap($('#testSound'), () => { FX.cheer(); say('Hello! This is how loud I am.'); });
tap($('#testRing'), () => { closeSettings(); if (call) return; if (current !== 'home') go('home'); setTimeout(() => maybeRing(true), 600); });
tap($('#doneBtn'), () => { closeSettings(); FX.pop(); });

/* ---------- Toddler-proofing ---------- */
['gesturestart','gesturechange','gestureend','contextmenu','selectstart','dragstart'].forEach(t => document.addEventListener(t, e => e.preventDefault()));
const inScroll = e => e.target && e.target.closest && e.target.closest('.pgrid, .sheet');
document.addEventListener('touchmove', e => { if (!inScroll(e)) e.preventDefault(); }, {passive:false});
let lastTouch = 0;
document.addEventListener('touchend', e => { const now = Date.now(); if (now - lastTouch < 350 && !inScroll(e)) e.preventDefault(); lastTouch = now; }, {passive:false});
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible'){ keepAwake(); updateClock(); }
  else { stopSong(); if (call){ stopCallSounds(); closeCall(); } }
});
let resizeT = 0;
window.addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(() => { fitContacts(); if (current === 'camera') sizeCamera(); }, 120); });

/* Offline after the first visit when self-hosted over HTTPS (artifacts and file:// skip this). */
try{ if ('serviceWorker' in navigator && location.protocol === 'https:' && !/claude\.ai|claudeusercontent/.test(location.hostname)) navigator.serviceWorker.register('sw.js').catch(() => {}); }catch(e){}

/* ---------- Start (and keep the current app across live updates) ---------- */
buildContacts();
loadFamily();
loadSounds();
seedPhotos();
window.claude?.hot?.snapshot?.(() => ({ app: current, scene: cam.scene }));
const start = (data) => { if (data && data.scene && SCENES[data.scene]) cam.scene = data.scene; if (data && data.app && data.app !== 'home') go(data.app); };
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
/* test hook: render one sound into an offline buffer (used by the tests to check every animal call) */
async function renderFx(name, secs=3){
  const prev = [ctx, master, noiseBuf], off = new OfflineAudioContext(1, 44100*secs, 44100);
  ctx = off; master = off.createGain(); master.connect(off.destination);
  let len = 0; try{ len = (typeof name === 'string' ? FX[name](0) : vox(name)) || 0; } finally { [ctx, master, noiseBuf] = prev; }
  const buf = await off.startRendering();
  return {len, data:Array.from(buf.getChannelData(0))};
}
window.__toyPhone = { go, renderFx, speakable, dino: () => ({fill:DinoBuddies.fill(), family:DinoBuddies.family()}), fx: () => Object.keys(FX), ringIn: () => maybeRing(true), photos: () => Photos.list.length, call: () => call && call.state, contacts: () => CONTACTS.length };
})();
